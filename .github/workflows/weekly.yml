# Every Monday: the starter against the newest rowstile release (npm's `next` while only alphas are out), so
# a release that breaks it is seen here first. It doesn't change the repository: a red run is the signal to look.
name: weekly
on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read

env:
  ROWSTILE_OWNER_DSN: postgresql://starter_owner:owner@localhost:5432/starter
  ROWSTILE_APP_URL: postgresql://starter_app:app@localhost:5432/starter

jobs:
  newest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-audit --no-fund rowstile@next @rowstile/client@next @rowstile/next@next @rowstile/prisma@next @rowstile/vitest@next
      - run: npx rowstile --version
      - run: psql "postgresql://postgres:postgres@localhost:5432/postgres" -v ON_ERROR_STOP=1 -f docker/init.sql
      - run: npx prisma migrate deploy
      - run: npx rowstile test
      - run: npx prisma generate && npx tsc --noEmit
      - run: npm test
